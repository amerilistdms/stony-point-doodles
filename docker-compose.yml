services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stonypoint
      MYSQL_USER: stonypoint
      MYSQL_PASSWORD: stonypoint
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: stonypoint
      WORDPRESS_DB_PASSWORD: stonypoint
      WORDPRESS_DB_NAME: stonypoint
    volumes:
      - ./wordpress:/var/www/html

volumes:
  db_data:
